<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2. Login Screen - ITM Gwalior</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #4A0404; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { position: relative; overflow: hidden; width: 390px; min-height: 844px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.12); display: flex; flex-direction: column; align-items: center; padding: 48px 24px 32px; }
  .blob-tl { position: absolute; top: -40px; left: -40px; width: 130px; height: 130px; background: #fce7f3; border-radius: 999px; }
  .blob-br { position: absolute; bottom: -40px; right: -40px; width: 140px; height: 140px; background: #fce7f3; border-radius: 999px; }
  .logo-wrap { position: relative; z-index: 1; text-align: center; margin-top: 20px; }
  .logo-wrap .logo-img { width: 180px; height: auto; display: block; margin: 0 auto; }
  .welcome { position: relative; z-index: 1; text-align: center; margin-top: 18px; }
  .welcome h1 { font-size: 22px; font-weight: 800; color: #111827; }
  .welcome p { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .toggle-pill { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; width: 100%; background: #f3f4f6; border-radius: 999px; padding: 4px; margin-top: 24px; }
  .toggle-pill button { border: none; padding: 10px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .toggle-pill .active { background: #4A0404; color: #ffffff; }
  .toggle-pill .inactive { background: transparent; color: #374151; }
  .btn-list { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
  .auth-btn { width: 100%; display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 600; color: #1f2937; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; }
  .g-icon { font-weight: 900; font-size: 18px; color: #2563eb; }
  .or-txt { position: relative; z-index: 1; font-size: 12px; color: #6b7280; margin: 22px 0 12px; }
  .guest-link { position: relative; z-index: 1; font-size: 13px; font-weight: 600; color: #1f2937; background: none; border: none; cursor: pointer; }
</style>
</head>
<body>
  <div class="phone">
    <div class="blob-tl"></div>
    <div class="blob-br"></div>
    <div class="logo-wrap">
      <img class="logo-img" src="logo.png" alt="ITM logo">
    </div>
    <div class="welcome">
      <h1>Welcome</h1>
      <p>Login to continue</p>
    </div>
    <div class="toggle-pill">
      <button class="active">Student Login</button>
      <button class="inactive">Guest Login</button>
    </div>
    <div class="btn-list">
      <button class="auth-btn"><span class="g-icon">G</span><span>Continue with Google</span></button>
      <button class="auth-btn"><span>&#9742;</span><span>Continue with Number</span></button>
    </div>
    <div class="or-txt">or</div>
    <button class="guest-link">Explore as Guest</button>
  </div>
</body>
</html>
