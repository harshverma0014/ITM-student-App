<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3. Main Dashboard (Events) - ITM Gwalior</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #4A0404; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { position: relative; width: 390px; min-height: 844px; background: #f9fafb; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
  .top-header { background: #4A0404; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .menu-btn { background: none; border: none; color: #ffffff; font-size: 20px; cursor: pointer; }
  .search-box { flex: 1; background: #ffffff; border-radius: 999px; padding: 7px 14px; display: flex; align-items: center; gap: 8px; }
  .search-box input { border: none; outline: none; width: 100%; font-size: 13px; color: #111827; }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: #fef3c7; color: #4A0404; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
  .tab { padding: 12px 0; text-align: center; font-size: 13px; font-weight: 700; color: #6b7280; border-bottom: 2px solid transparent; }
  .tab.active { color: #4A0404; border-bottom-color: #4A0404; }
  .content { flex: 1; padding: 14px 16px 84px; overflow-y: auto; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pill { border: none; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e5e7eb; color: #374151; }
  .pill.active { background: #4A0404; color: #ffffff; }
  .card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
  .card-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .icon-sq { width: 34px; height: 34px; border-radius: 8px; background: #fef2f2; color: #991b1b; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .card h3 { font-size: 15px; font-weight: 800; color: #111827; }
  .card .desc { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .banner { height: 112px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; margin-bottom: 10px; }
  .banner-tech { background: linear-gradient(135deg, #1e1b4b, #4338ca, #db2777); }
  .banner-code { background: linear-gradient(135deg, #0f172a, #1e293b, #0284c7); }
  .banner .big { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .meta { display: flex; justify-content: space-between; font-size: 11px; color: #4b5563; margin-bottom: 10px; }
  .reg-btn { width: 100%; background: #4A0404; color: #ffffff; border: none; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .bottom-nav { position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e5e7eb; display: grid; grid-template-columns: 1fr 1fr; padding: 8px 0; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #6b7280; text-decoration: none; }
  .nav-item.active { color: #4A0404; }
</style>
</head>
<body>
  <div class="phone">
    <div class="top-header">
      <button class="menu-btn">&#9776;</button>
      <div class="search-box"><span>&#128269;</span><input type="text" placeholder="Search events..." /></div>
      <div class="avatar">HV</div>
    </div>
    <div class="tabs">
      <div class="tab active">Events</div>
      <div class="tab">Announcements</div>
    </div>
    <div class="content">
      <div class="filters">
        <button class="pill active">Today</button>
        <button class="pill">This Week</button>
        <button class="pill">Next Week</button>
        <button class="pill">This Month</button>
      </div>
      <div class="card">
        <div class="card-top">
          <div class="icon-sq">&#128197;</div>
          <div>
            <h3>Tech Fest 2025</h3>
            <p class="desc">Innovation &bull; Ideas &bull; Impact</p>
          </div>
        </div>
        <div class="banner banner-tech"><div class="big">TECH FEST</div></div>
        <div class="meta"><span>&#128336; Nov 20, 2025</span><span>&#128205; Main Auditorium</span></div>
        <button class="reg-btn">Register Now</button>
      </div>
      <div class="card">
        <div class="card-top">
          <div class="icon-sq">&#127942;</div>
          <div>
            <h3>Coding Competition</h3>
            <p class="desc">Code. Compete. Win.</p>
          </div>
        </div>
        <div class="banner banner-code"><div class="big">&lt;/&gt;</div></div>
        <div class="meta"><span>&#128336; Nov 22, 2025</span><span>&#128205; Lab 1</span></div>
      </div>
    </div>
    <div class="bottom-nav">
      <a class="nav-item active" href="#"><span>&#8962;</span><span>Home</span></a>
      <a class="nav-item" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><span>&#9654;</span><span>YouTube</span></a>
    </div>
  </div>
</body>
</html>
