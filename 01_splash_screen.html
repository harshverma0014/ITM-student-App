<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1. Splash Screen (3 sec) - ITM Gwalior</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #4A0404; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.12); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
  .badge-row { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
  .itm-logo { text-align: center; }
  .itm-logo .logo-img { width: 120px; height: auto; display: block; margin: 0 auto; }
  .itm-logo .sub { font-size: 8px; font-weight: 700; color: #374151; margin-top: 4px; text-transform: uppercase; }
  .itm-logo .tagline { font-size: 7px; font-weight: 700; color: #991b1b; margin-top: 2px; }
  .divider { width: 1px; height: 54px; background: #d1d5db; }
  .nba-box { text-align: center; }
  .nba-box .nba { font-size: 20px; font-weight: 900; color: #1d4ed8; letter-spacing: -0.5px; }
  .nba-box .txt { font-size: 6.5px; color: #4b5563; max-width: 72px; line-height: 1.2; margin-top: 2px; }
  .naac-box { width: 58px; height: 58px; border-radius: 999px; border: 2px solid #b45309; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fffbeb; }
  .naac-box .grade { font-size: 20px; font-weight: 900; color: #991b1b; line-height: 1; }
  .naac-box .lbl { font-size: 7px; font-weight: 800; color: #92400e; margin-top: 2px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="badge-row">
      <div class="itm-logo">
        <img class="logo-img" src="logo.png" alt="ITM logo">
        <div class="sub">INSTITUTE OF TECHNOLOGY &amp; MANAGEMENT</div>
        <div class="tagline">"THINK BIG... THINK BEYOND"</div>
      </div>
      <div class="divider"></div>
      <div class="nba-box">
        <div class="nba">NBA</div>
        <div class="txt">NATIONAL BOARD OF ACCREDITATION</div>
      </div>
      <div class="naac-box">
        <div class="grade">A</div>
        <div class="lbl">NAAC</div>
      </div>
    </div>
  </div>
</body>
</html>
