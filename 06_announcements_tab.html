<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>6. Announcements Tab - ITM Gwalior</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #4A0404; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { position: relative; width: 390px; min-height: 844px; background: #f9fafb; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
  .top-header { background: #4A0404; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .menu-btn { background: none; border: none; color: #ffffff; font-size: 20px; cursor: pointer; }
  .search-box { flex: 1; background: #ffffff; border-radius: 999px; padding: 7px 14px; display: flex; align-items: center; gap: 8px; }
  .search-box input { border: none; outline: none; width: 100%; font-size: 13px; color: #111827; }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: #fef3c7; color: #4A0404; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
  .tab { padding: 12px 0; text-align: center; font-size: 13px; font-weight: 700; color: #6b7280; border-bottom: 2px solid transparent; }
  .tab.active { color: #4A0404; border-bottom-color: #4A0404; }
  .content { flex: 1; padding: 14px 16px 84px; overflow-y: auto; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pill { border: none; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e5e7eb; color: #374151; }
  .pill.active { background: #4A0404; color: #ffffff; }
  .notice { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
  .megaphone { width: 38px; height: 38px; border-radius: 12px; background: #fef2f2; color: #b91c1c; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .date { font-size: 11px; color: #6b7280; font-weight: 600; }
  .notice h3 { font-size: 14px; font-weight: 800; color: #111827; margin-top: 2px; }
  .notice p { font-size: 12px; color: #4b5563; margin-top: 3px; }
  .bottom-nav { position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e5e7eb; display: grid; grid-template-columns: 1fr 1fr; padding: 8px 0; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #6b7280; text-decoration: none; }
  .nav-item.active { color: #4A0404; }
</style>
</head>
<body>
  <div class="phone">
    <div class="top-header">
      <button class="menu-btn">&#9776;</button>
      <div class="search-box"><span>&#128269;</span><input type="text" placeholder="Search announcements..." /></div>
      <div class="avatar">HV</div>
    </div>
    <div class="tabs">
      <div class="tab">Events</div>
      <div class="tab active">Announcements</div>
    </div>
    <div class="content">
      <div class="filters">
        <button class="pill active">All</button>
        <button class="pill">1st Year</button>
        <button class="pill">2nd Year</button>
        <button class="pill">3rd Year</button>
      </div>
      <div class="notice">
        <div class="megaphone">&#128226;</div>
        <div>
          <div class="date">Nov 18, 2025</div>
          <h3>Winter Break Schedule</h3>
          <p>Winter break will be from Dec 20 to Jan 5.</p>
        </div>
      </div>
      <div class="notice">
        <div class="megaphone">&#128226;</div>
        <div>
          <div class="date">Nov 17, 2025</div>
          <h3>Hackathon 2025 Announced</h3>
          <p>Register now for the annual hackathon!</p>
        </div>
      </div>
      <div class="notice">
        <div class="megaphone">&#128226;</div>
        <div>
          <div class="date">Nov 15, 2025</div>
          <h3>Library Timings Extended</h3>
          <p>Library will remain open till 10 PM.</p>
        </div>
      </div>
    </div>
    <div class="bottom-nav">
      <a class="nav-item active" href="#"><span>&#8962;</span><span>Home</span></a>
      <a class="nav-item" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><span>&#9654;</span><span>YouTube</span></a>
    </div>
  </div>
</body>
</html>
